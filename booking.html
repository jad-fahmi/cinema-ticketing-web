<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Ticketing System - Browse Movies</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="nav-rail">
    <span class="brand">CT</span>
    <nav>
      <a href="#top" class="active">Browse</a>
      <a href="#now-showing">Movies</a>
      <a href="#booking-form">Book</a>
    </nav>
    <a href="index.html">Logout</a>
  </aside>

  <main class="main-content">

    <section class="hero" id="top">
      <div class="hero-content">
        <span class="hero-tag">Featured</span>
        <h1>Superman</h1>
        <p>
          Superman balances his Kryptonian heritage with his human upbringing
          as Clark Kent.
        </p>
        <a href="#booking-form" class="btn btn-primary">Book Tickets</a>
      </div>
    </section>

    <section class="section" id="now-showing">
      <h2>Now Showing</h2>

      <div class="movie-row">

        <article class="movie-card">
          <img src="images/batman.jpg" alt="Batman poster">
          <strong>Batman</strong>
          <span>Action</span>
        </article>

        <article class="movie-card">
          <img src="images/fight-club.jpg" alt="Fight Club poster">
          <strong>Fight Club</strong>
          <span>Drama</span>
        </article>

        <article class="movie-card">
          <img src="images/good-will-hunting.jpg" alt="Good Will Hunting poster">
          <strong>Good Will Hunting</strong>
          <span>Drama</span>
        </article>

        <article class="movie-card">
          <img src="images/superman.jpg" alt="Superman poster">
          <strong>Superman</strong>
          <span>Action</span>
        </article>

        <article class="movie-card">
          <img src="images/tfatf.jpg" alt="The Fast and the Furious poster">
          <strong>The Fast and the Furious</strong>
          <span>Action</span>
        </article>

      </div>
    </section>

    <section class="section" id="booking-form">
      <h2>Book Your Tickets</h2>

      <div class="booking-form-wrap">
        <form action="confirmation.html" method="get">

          <div class="form-grid">

            <div class="field">
              <label for="cust-name">Customer Name</label>
              <input
                type="text"
                id="cust-name"
                name="custName"
                placeholder="Full name"
                required>
            </div>

            <div class="field">
              <label for="cust-email">Email</label>
              <input
                type="email"
                id="cust-email"
                name="custEmail"
                placeholder="you@example.com"
                required>
            </div>

            <div class="field">
              <label for="cust-phone">Phone</label>
              <input
                type="tel"
                id="cust-phone"
                name="custPhone"
                placeholder="0123456789"
                required>
            </div>

            <div class="field">
              <label for="movie">Movie</label>
              <select id="movie" name="movie" required>
                <option value="" disabled selected>Select a movie</option>
                <option>Batman</option>
                <option>Fight Club</option>
                <option>Good Will Hunting</option>
                <option>Superman</option>
                <option>The Fast and the Furious</option>
              </select>
            </div>

            <div class="field">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" required>
            </div>

            <div class="field">
              <label for="showtime">Showtime</label>
              <select id="showtime" name="showtime" required>
                <option value="" disabled selected>Select a showtime</option>
                <option>12:30 PM</option>
                <option>3:45 PM</option>
                <option>7:00 PM</option>
                <option>9:45 PM</option>
              </select>
            </div>

            <div class="field">
              <label for="tickets">Number of Tickets</label>
              <input
                type="number"
                id="tickets"
                name="tickets"
                min="1"
                max="10"
                value="1"
                required>
            </div>

          </div>

          <button type="submit" class="btn btn-primary">Book Tickets</button>

        </form>
      </div>
    </section>

  </main>
</div>

</body>
</html>
